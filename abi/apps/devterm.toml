id = "devterm"
state = "stateful"
quiesce = "stop-units"
snapshot = "copy-tabs-and-usage"
forward = "copy-retained-paths"
write_capture = "capture-post-cutover-writes"
reverse = "restore-retained-paths"
rpo = "0"
paths = [
  "~/.config/airlock-devterm/tabs.json",
  "~/.local/state/airlock/devterm/codex-usage.json",
]
capabilities = ["plaintext-redirect"]
