<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-title" content="Folio">
  <link rel="icon" href="/assets/app-icons/notes.svg">
  <link rel="apple-touch-icon" href="/assets/app-icons/notes.png">
  <title>Folio</title>
  <style>
    :root{color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:#fbfbf8;color:#252522}
    body{min-height:100vh;margin:0;display:grid;place-items:center;background:#fbfbf8}
    main{width:min(560px,calc(100% - 32px));padding:40px 0}
    h1{margin:0 0 10px;font-size:32px;letter-spacing:-.035em}p{margin:0;color:#686862;line-height:1.65}
    a{display:inline-flex;align-items:center;min-height:42px;margin-top:24px;padding:0 15px;border:1px solid #deded7;border-radius:9px;background:#f3f3ef;color:#252522;font-weight:650;text-decoration:none}
    a:hover{background:#ecece6}a:focus-visible{outline:3px solid #5b57c8;outline-offset:3px}
    @media(prefers-color-scheme:dark){:root,body{background:#20201e;color:#ecece7}p{color:#aaa9a2}a{border-color:#454540;background:#2c2c29;color:#ecece7}a:hover{background:#373733}}
  </style>
</head>
<body>
  <main>
    <h1>Folio</h1>
    <p>빨리 적고, 기억나는 말로 바로 다시 찾는 문서 공간입니다.</p>
    <a href="/notes/">문서 열기</a>
  </main>
</body>
</html>
