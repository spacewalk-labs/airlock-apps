<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Publish</title>
<style>
  :root {
    --bg: #f5f5f7; --surface: #fff; --text: #1d1d1f; --muted: #6e6e73;
    --line: #d2d2d7; --accent: #0066cc; --danger: #d70015; --hover: #ececf0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --surface: #1c1c1e; --text: #f5f5f7; --muted: #98989d;
            --line: #38383a; --accent: #2997ff; --danger: #ff453a; --hover: #2c2c2e; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: max(env(safe-area-inset-top), 1.5rem) 1.25rem 4rem;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  header { margin-bottom: 1.25rem; }
  h1 { font-size: 1.6rem; margin: 0; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 0.9rem; margin-top: 0.2rem; word-break: break-all; }

  /* buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface); border: 1px solid var(--line); color: var(--text);
    padding: 7px 14px; border-radius: 980px; font-size: 0.9rem;
    cursor: pointer; text-decoration: none; font-family: inherit; line-height: 1.2;
  }
  .btn:hover { border-color: var(--accent); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn.sm { padding: 4px 11px; font-size: 0.82rem; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { color: var(--danger); border-color: var(--danger); }
  .btn.danger:hover { background: var(--danger); color: #fff; }

  /* bars */
  .bar { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 0.9rem; }
  .filterbar input[type="search"], .filterbar select {
    background: var(--surface); border: 1px solid var(--line); color: var(--text);
    padding: 7px 11px; border-radius: 10px; font: inherit; font-size: 0.9rem;
  }
  .filterbar input[type="search"] { flex: 1; min-width: 160px; }
  .count { color: var(--muted); font-size: 0.85rem; margin-left: auto; }
  .ext-note { color: var(--muted); font-size: 0.85rem; }

  .batchbar {
    display: flex; align-items: center; gap: 0.9rem; flex-wrap: wrap;
    padding: 0.6rem 0.9rem; margin-bottom: 0.9rem;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  }
  .chk { display: inline-flex; align-items: center; gap: 6px; font-size: 0.88rem; cursor: pointer; }
  .chk input { width: 16px; height: 16px; accent-color: var(--accent); }
  .chk.danger { color: var(--danger); }
  .chk.danger input { accent-color: var(--danger); }
  .batchbar .selcount { color: var(--muted); font-size: 0.85rem; }
  .batchbar .btn { margin-left: auto; }

  /* list */
  .list { display: flex; flex-direction: column; gap: 0.6rem; }
  .row {
    display: flex; align-items: flex-start; gap: 0.75rem;
    padding: 0.8rem 0.9rem;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    transition: border-color .1s ease;
  }
  .row:hover { border-color: var(--muted); }
  .row.selected { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .rowchk { width: 17px; height: 17px; margin-top: 3px; accent-color: var(--accent); flex: 0 0 auto; cursor: pointer; }
  .main { flex: 1 1 auto; min-width: 0; }
  .nameline { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .icon { flex: 0 0 auto; }
  .name { color: var(--accent); text-decoration: none; font-weight: 600; word-break: break-all; }
  .name:hover { text-decoration: underline; }
  .pubbadge {
    display: inline-block; padding: 1px 8px; border-radius: 980px;
    border: 1px solid var(--accent); color: var(--accent);
    font-size: 0.72rem; white-space: nowrap;
  }
  .meta { color: var(--muted); font-size: 0.82rem; margin-top: 0.15rem; }
  .target { color: var(--muted); font-size: 0.8rem; margin-top: 0.1rem; word-break: break-all; font-variant-numeric: tabular-nums; }
  .acts { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; flex: 0 0 auto; justify-content: flex-end; }
  .confirm { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .cinput {
    background: var(--bg); border: 1px solid var(--danger); color: var(--text);
    padding: 4px 9px; border-radius: 8px; font: inherit; font-size: 0.82rem; width: 190px; max-width: 55vw;
  }
  .empty { color: var(--muted); text-align: center; padding: 3rem 1rem; }

  /* modal */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    display: none; align-items: center; justify-content: center; padding: 1rem; z-index: 100;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 1.5rem; width: 100%; max-width: 560px; max-height: 85vh; overflow: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .modal h2 { margin: 0 0 0.75rem; font-size: 1.2rem; }
  .modal p { color: var(--muted); font-size: 0.9rem; margin: 0.4rem 0 1rem; }
  .modal label.field { display: block; font-size: 0.9rem; margin: 0.75rem 0; }
  .modal select {
    display: block; margin-top: 0.4rem; background: var(--bg); border: 1px solid var(--line);
    color: var(--text); padding: 7px 11px; border-radius: 10px; font: inherit; font-size: 0.9rem;
  }
  .modal-actions { display: flex; justify-content: flex-end; gap: 0.6rem; margin-top: 1.25rem; }
  .result { margin-top: 1rem; padding: 0.9rem; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; }
  .result a { color: var(--accent); word-break: break-all; }
  .result .exp { color: var(--muted); font-size: 0.82rem; margin-top: 0.5rem; }
  .result .btn { margin-top: 0.6rem; }

  .links-body { display: flex; flex-direction: column; }
  .link-row { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; padding: 0.7rem 0; border-top: 1px solid var(--line); }
  .link-row:first-child { border-top: 0; }
  .link-main { flex: 1 1 240px; min-width: 0; }
  .link-title { font-weight: 600; }
  .link-url { display: block; color: var(--accent); text-decoration: none; font-size: 0.82rem; word-break: break-all; }
  .link-url:hover { text-decoration: underline; }
  .link-exp { font-size: 0.82rem; color: var(--muted); white-space: nowrap; }
  .link-exp.expired { color: var(--danger); }
  .link-acts { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .link-acts select {
    background: var(--bg); border: 1px solid var(--line); color: var(--text);
    padding: 4px 8px; border-radius: 8px; font: inherit; font-size: 0.8rem;
  }

  /* toast */
  #toast {
    position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
    background: var(--surface); color: var(--text); border: 1px solid var(--line);
    border-radius: 980px; padding: 0.6rem 1.25rem; font-size: 0.9rem;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2); opacity: 0; pointer-events: none;
    transition: opacity .2s ease; z-index: 200; max-width: 90vw; text-align: center;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Publish</h1>
    <div class="sub" id="root-note">Static share manager</div>
  </header>

  <div class="bar">
    <label class="btn">Upload file<input type="file" id="upload" hidden></label>
    <button class="btn" id="repair">Repair broken links</button>
    <button class="btn" id="mylinks" hidden>My public links</button>
    <span class="ext-note" id="ext-note" hidden>External publishing not configured</span>
  </div>

  <div class="bar filterbar">
    <input type="search" id="search" placeholder="Filter by name…" autocomplete="off">
    <select id="type">
      <option value="all">All types</option>
      <option value="html">HTML</option>
      <option value="image">Images</option>
      <option value="dir">Folders</option>
      <option value="file">Files</option>
    </select>
    <span class="count" id="count"></span>
  </div>

  <div class="batchbar">
    <label class="chk"><input type="checkbox" id="selall"> Select all</label>
    <span class="selcount" id="selcount">0 selected</span>
    <label class="chk danger"><input type="checkbox" id="incdirect"> include direct files (permanent delete)</label>
    <button class="btn danger" id="dounpublish" disabled>Unpublish selected</button>
  </div>

  <div class="list" id="list"></div>
  <div class="empty" id="empty" hidden>No published items.</div>
</div>

<!-- external publish modal -->
<div class="modal-bg" id="m-pub">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="pub-h">
    <h2 id="pub-h">Publish externally</h2>
    <p>A self-contained snapshot of <b id="pub-name"></b> is copied to a public URL. Anyone with the link can view it — publish public-safe content only.</p>
    <label class="field">Duration
      <select id="pub-ttl">
        <option value="24">24 hours</option>
        <option value="168">7 days</option>
        <option value="720">30 days</option>
      </select>
    </label>
    <div class="result" id="pub-result" hidden>
      <a id="pub-url" href="#" target="_blank" rel="noopener"></a>
      <div><button class="btn sm" id="pub-copy">Copy URL</button></div>
      <div class="exp" id="pub-expiry"></div>
    </div>
    <div class="modal-actions">
      <button class="btn" data-close>Close</button>
      <button class="btn primary" id="pub-go">Publish</button>
    </div>
  </div>
</div>

<!-- my public links modal -->
<div class="modal-bg" id="m-links">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="links-h">
    <h2 id="links-h">My public links</h2>
    <div class="links-body" id="links-body">Loading…</div>
    <div class="modal-actions">
      <button class="btn" data-close>Close</button>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

var state = { items: [], pubBySrc: {}, publicEnabled: false, root: "",
              selected: {}, confirming: {}, filtered: [] };

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function keys(o) { return Object.keys(o); }

// ---- toast ----
var toastT;
function toast(msg) {
  var t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove("show"); }, 2400);
}

// ---- clipboard copy (execCommand fallback for non-secure http) ----
function execCopy(text) {
  try {
    var ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
    document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
    var ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}
function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return execCopy(text); });
  }
  return Promise.resolve(execCopy(text));
}
function copyAndToast(text) {
  copyText(text).then(function (ok) { toast(ok ? "Copied to clipboard" : "Copy failed — select and copy manually"); });
}

// ---- api ----
function apiGet(path) {
  return fetch(path, { cache: "no-store", headers: { Accept: "application/json" } }).then(function (r) { return r.json(); });
}
function apiPost(path, body) {
  return fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body || {}) })
    .then(function (r) { return r.json(); });
}

// ---- load ----
function load() {
  return apiGet("/publish/api/list").then(function (d) {
    state.items = d.items || [];
    state.publicEnabled = !!d.public_enabled;
    state.root = d.root || "";
    var live = {};
    state.items.forEach(function (x) { live[x.name] = true; });
    keys(state.selected).forEach(function (n) { if (!live[n]) delete state.selected[n]; });
    keys(state.confirming).forEach(function (n) { if (!live[n]) delete state.confirming[n]; });
    applyPublicUI();
    render();
    // Public badges fetched AFTER the local list — a slow/dead remote never blocks rendering.
    if (state.publicEnabled) {
      apiGet("/publish/api/public-list").then(function (pd) {
        state.pubBySrc = {};
        ((pd && pd.items) || []).forEach(function (p) { state.pubBySrc[p.src] = p; });
        render();
      }).catch(function () {});
    }
  }).catch(function (e) {
    $("#list").innerHTML = "";
    var em = $("#empty"); em.hidden = false;
    em.textContent = "Failed to reach backend: " + e.message;
  });
}

function applyPublicUI() {
  $("#mylinks").hidden = !state.publicEnabled;
  $("#ext-note").hidden = state.publicEnabled;
  if (state.root) $("#root-note").textContent = "Managing " + state.root;
}

// ---- render ----
function iconFor(it) {
  if (it.type === "dir") return "📁";
  if (it.type === "image") return "🖼";
  return it.isLink ? "📄" : "📌";
}

function rowHTML(it) {
  var fileURL = "/publish/files/" + encodeURIComponent(it.name);
  var pub = state.pubBySrc[it.name];
  var badge = pub ? '<span class="pubbadge" title="Published externally">🌐 public</span>' : "";
  var meta = esc(it.type) + " · " + esc(it.size) + " · " + esc(it.mtime);
  var target = it.isLink ? '<div class="target">→ ' + esc(it.target_dir || it.target || "?") + "</div>" : "";

  var acts = "";
  if (it.isLink) {
    acts += '<button class="btn sm danger" data-act="unpublish" data-name="' + esc(it.name) + '">Unpublish</button>';
  } else if (it.isDir) {
    /* real directory: backend refuses deletion, so no action */
  } else if (state.confirming[it.name]) {
    acts += '<span class="confirm"><input class="cinput" placeholder="type name to confirm" aria-label="confirm filename">'
          + '<button class="btn sm danger" data-act="delete-confirm" data-name="' + esc(it.name) + '">Delete</button>'
          + '<button class="btn sm" data-act="delete-cancel" data-name="' + esc(it.name) + '">Cancel</button></span>';
  } else {
    acts += '<button class="btn sm danger" data-act="delete" data-name="' + esc(it.name) + '">Delete</button>';
  }
  if (state.publicEnabled && it.type === "html") {
    acts += '<button class="btn sm" data-act="pub-ext" data-name="' + esc(it.name) + '">🌐 Publish externally</button>';
  }

  var checked = state.selected[it.name] ? " checked" : "";
  var sel = state.selected[it.name] ? " selected" : "";
  return '<div class="row' + sel + '">'
    + '<input type="checkbox" class="rowchk" data-name="' + esc(it.name) + '"' + checked + ' aria-label="select ' + esc(it.name) + '">'
    + '<div class="main">'
    +   '<div class="nameline"><span class="icon">' + iconFor(it) + "</span>"
    +     '<a class="name" href="' + fileURL + '" target="_blank" rel="noopener">' + esc(it.name) + "</a>" + badge + "</div>"
    +   '<div class="meta">' + meta + "</div>" + target
    + "</div>"
    + '<div class="acts">' + acts + "</div>"
    + "</div>";
}

function render() {
  var q = $("#search").value.trim().toLowerCase();
  var type = $("#type").value;
  var rows = state.items.filter(function (it) {
    if (type !== "all" && it.type !== type) return false;
    if (q && it.name.toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  state.filtered = rows;
  $("#count").textContent = rows.length + " of " + state.items.length;

  var list = $("#list"), empty = $("#empty");
  if (rows.length === 0) {
    list.innerHTML = "";
    empty.hidden = false;
    empty.textContent = state.items.length === 0 ? "No published items." : "No items match the filter.";
  } else {
    empty.hidden = true;
    list.innerHTML = rows.map(rowHTML).join("");
  }
  updateBatch();
}

// ---- row actions ----
$("#list").addEventListener("click", function (ev) {
  var btn = ev.target.closest("[data-act]");
  if (!btn) return;
  var act = btn.dataset.act, name = btn.dataset.name;
  if (act === "unpublish") doUnpublish(name);
  else if (act === "delete") { state.confirming[name] = true; render(); }
  else if (act === "delete-cancel") { delete state.confirming[name]; render(); }
  else if (act === "delete-confirm") doDeleteDirect(name, btn);
  else if (act === "pub-ext") openPubModal(name);
});

$("#list").addEventListener("change", function (ev) {
  var cb = ev.target.closest(".rowchk");
  if (!cb) return;
  var name = cb.dataset.name;
  if (cb.checked) state.selected[name] = true; else delete state.selected[name];
  var row = cb.closest(".row");
  if (row) row.classList.toggle("selected", cb.checked);
  updateBatch();
});

function doUnpublish(name) {
  apiPost("/publish/api/unpublish", { name: name }).then(function (d) {
    if (d.ok) { toast("Unpublished " + name); load(); }
    else toast("Failed: " + (d.message || d.error || "error"));
  }).catch(function (e) { toast("Failed: " + e.message); });
}

function doDeleteDirect(name, btn) {
  var input = btn.closest(".row").querySelector(".cinput");
  var typed = input ? input.value : "";
  if (typed !== name) { toast("Name does not match — deletion cancelled"); return; }
  apiPost("/publish/api/unpublish-direct", { name: name, confirm_name: typed }).then(function (d) {
    if (d.ok) { delete state.confirming[name]; toast("Deleted " + name); load(); }
    else toast("Failed: " + (d.message || d.error || "error"));
  }).catch(function (e) { toast("Failed: " + e.message); });
}

// ---- batch ----
function updateBatch() {
  var n = keys(state.selected).length;
  $("#selcount").textContent = n + " selected";
  $("#dounpublish").disabled = n === 0;
  var all = state.filtered.length > 0 && state.filtered.every(function (it) { return state.selected[it.name]; });
  $("#selall").checked = all;
}
$("#selall").addEventListener("change", function (e) {
  var on = e.target.checked;
  state.filtered.forEach(function (it) { if (on) state.selected[it.name] = true; else delete state.selected[it.name]; });
  render();
});
$("#dounpublish").addEventListener("click", function () {
  var names = keys(state.selected);
  if (!names.length) return;
  var includeDirect = $("#incdirect").checked;
  var btn = $("#dounpublish"); btn.disabled = true;
  apiPost("/publish/api/unpublish-batch", { names: names, include_direct: includeDirect }).then(function (d) {
    var results = d.results || [];
    var ok = d.ok_count != null ? d.ok_count : results.filter(function (r) { return r.ok; }).length;
    var skipped = results.filter(function (r) { return r.kind === "direct-skipped" || r.kind === "dir"; }).length;
    var failed = results.filter(function (r) { return !r.ok && r.kind !== "direct-skipped" && r.kind !== "dir"; }).length;
    results.forEach(function (r) { if (r.ok) delete state.selected[r.name]; });
    var msg = "Unpublished " + ok + " of " + (d.count != null ? d.count : names.length);
    if (skipped) msg += ", " + skipped + " skipped";
    if (failed) msg += ", " + failed + " failed";
    toast(msg);
    load();
  }).catch(function (e) { btn.disabled = false; toast("Failed: " + e.message); });
});

// ---- repair ----
$("#repair").addEventListener("click", function () {
  var btn = this; btn.disabled = true;
  apiPost("/publish/api/repair-broken", {}).then(function (d) {
    btn.disabled = false;
    var results = d.results || [];
    if (!results.length) { toast("No broken links found"); return; }
    var repaired = results.filter(function (r) { return r.action === "repair" && r.ok; }).length;
    var unlinked = results.filter(function (r) { return r.action === "unlink" && r.ok; }).length;
    toast("Repaired " + repaired + ", removed " + unlinked);
    load();
  }).catch(function (e) { btn.disabled = false; toast("Failed: " + e.message); });
});

// ---- upload ----
var MAX_UPLOAD = 50 * 1024 * 1024;
$("#upload").addEventListener("change", function (ev) {
  var file = ev.target.files && ev.target.files[0];
  ev.target.value = "";  // reset so re-selecting the same file fires again
  if (!file) return;
  if (file.size > MAX_UPLOAD) { toast("File too large (max 50 MB)"); return; }
  var reader = new FileReader();
  reader.onload = function () {
    var res = String(reader.result || "");
    var comma = res.indexOf(",");
    var data = comma >= 0 ? res.slice(comma + 1) : res;
    toast("Uploading " + file.name + "…");
    apiPost("/publish/api/upload-file", { name: file.name, data: data }).then(function (d) {
      if (d.ok) { toast("Uploaded " + d.name); load(); }
      else toast("Upload failed: " + (d.error || "error"));
    }).catch(function (e) { toast("Upload failed: " + e.message); });
  };
  reader.onerror = function () { toast("Could not read file"); };
  reader.readAsDataURL(file);
});

// ---- filters ----
$("#search").addEventListener("input", render);
$("#type").addEventListener("change", render);

// ---- external publish modal ----
var mPub = $("#m-pub");
function openPubModal(name) {
  mPub.dataset.name = name;
  mPub.dataset.url = "";
  $("#pub-name").textContent = name;
  $("#pub-result").hidden = true;
  $("#pub-ttl").disabled = false;
  var go = $("#pub-go"); go.disabled = false; go.hidden = false; go.textContent = "Publish";
  mPub.classList.add("show");
}
$("#pub-go").addEventListener("click", function () {
  var name = mPub.dataset.name;
  var ttl = parseInt($("#pub-ttl").value, 10);
  var go = this; go.disabled = true; go.textContent = "Publishing…";
  apiPost("/publish/api/publish-public", { name: name, ttl_hours: ttl }).then(function (d) {
    if (!d.ok) { go.disabled = false; go.textContent = "Publish"; toast("Failed: " + (d.error || "error")); return; }
    var r = d.result || {};
    var a = $("#pub-url"); a.href = r.url || "#"; a.textContent = r.url || "";
    $("#pub-expiry").textContent = r.expiry ? "Expires " + new Date(r.expiry * 1000).toLocaleString() : "";
    $("#pub-result").hidden = false;
    $("#pub-ttl").disabled = true;
    go.hidden = true;
    mPub.dataset.url = r.url || "";
    toast("Published externally");
    load();
  }).catch(function (e) { go.disabled = false; go.textContent = "Publish"; toast("Failed: " + e.message); });
});
$("#pub-copy").addEventListener("click", function () { copyAndToast(mPub.dataset.url || $("#pub-url").href); });

// ---- my public links modal ----
var mLinks = $("#m-links");
$("#mylinks").addEventListener("click", function () { mLinks.classList.add("show"); loadLinks(); });

function loadLinks() {
  var body = $("#links-body"); body.textContent = "Loading…";
  apiGet("/publish/api/public-list").then(function (d) {
    if (!d.ok) { body.textContent = "Error: " + (d.error || "unavailable"); return; }
    var items = d.items || [];
    if (!items.length) { body.textContent = "No public links."; return; }
    body.innerHTML = items.map(linkRowHTML).join("");
  }).catch(function (e) { body.textContent = "Error: " + e.message; });
}
function linkRowHTML(it) {
  var exp = it.expired ? "Expired" : (it.expiry ? new Date(it.expiry * 1000).toLocaleDateString() : "—");
  var ttlSel = '<select class="ttl" aria-label="new duration">'
    + '<option value="24">24 hours</option><option value="168">7 days</option><option value="720">30 days</option></select>';
  return '<div class="link-row">'
    + '<div class="link-main"><div class="link-title">' + esc(it.title || it.slug) + "</div>"
    +   '<a class="link-url" href="' + esc(it.url) + '" target="_blank" rel="noopener">' + esc(it.url) + "</a></div>"
    + '<div class="link-exp' + (it.expired ? " expired" : "") + '">' + esc(exp) + "</div>"
    + '<div class="link-acts">'
    +   '<button class="btn sm" data-lact="copy" data-url="' + esc(it.url) + '">Copy</button>'
    +   ttlSel
    +   '<button class="btn sm" data-lact="setexp" data-slug="' + esc(it.slug) + '">Change expiry</button>'
    +   '<button class="btn sm danger" data-lact="revoke" data-slug="' + esc(it.slug) + '">Revoke</button>'
    + "</div></div>";
}
$("#links-body").addEventListener("click", function (ev) {
  var b = ev.target.closest("[data-lact]");
  if (!b) return;
  var act = b.dataset.lact;
  if (act === "copy") { copyAndToast(b.dataset.url); return; }
  if (act === "revoke") {
    apiPost("/publish/api/public-revoke", { slug: b.dataset.slug }).then(function (d) {
      if (d.ok) { toast("Revoked"); loadLinks(); load(); }
      else toast("Failed: " + (d.error || d.message || "error"));
    }).catch(function (e) { toast("Failed: " + e.message); });
    return;
  }
  if (act === "setexp") {
    var sel = b.closest(".link-row").querySelector(".ttl");
    var ttl = parseInt(sel.value, 10);
    b.disabled = true;
    apiPost("/publish/api/public-set-expiry", { slug: b.dataset.slug, ttl_hours: ttl }).then(function (d) {
      b.disabled = false;
      if (d.ok) { toast("Expiry updated"); loadLinks(); load(); }
      else toast("Failed: " + (d.error || d.message || "error"));
    }).catch(function (e) { b.disabled = false; toast("Failed: " + e.message); });
  }
});

// ---- modal close ----
$$("[data-close]").forEach(function (b) {
  b.addEventListener("click", function () { $$(".modal-bg").forEach(function (m) { m.classList.remove("show"); }); });
});
$$(".modal-bg").forEach(function (m) {
  m.addEventListener("click", function (e) { if (e.target === m) m.classList.remove("show"); });
});

// ---- init ----
load();
</script>
<script src="/airlock-return.js" data-mode="corner" defer></script>
</body>
</html>
